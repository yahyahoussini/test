version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bio-cosmetics-postgres-dev
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bio_cosmetics_dev

  redis:
    image: redis:7-alpine
    container_name: bio-cosmetics-redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
