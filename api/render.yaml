services:
  # --- Backend API Service ---
  - type: web
    name: api
    env: node
    plan: free # Or your preferred plan
    rootDir: api
    buildCommand: "pnpm install && pnpm build"
    startCommand: "pnpm start"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.onrender.com # Change this to your frontend URL
      - fromGroup: api-secrets

  # --- PostgreSQL Database ---
  - type: pserv
    name: postgres
    env: postgres
    plan: free # Or your preferred plan
    postgresMajorVersion: 15
    disk:
      name: postgres-data
      sizeGB: 1
      mountPath: /var/lib/postgresql/data

  # --- Redis Instance ---
  - type: redis
    name: redis
    plan: free # Or your preferred plan
    ipAllowList: [] # Add your services' IPs here if needed

# --- Environment Variable Group ---
# Store your secrets here in the Render dashboard
envVarGroups:
  - name: api-secrets
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: TOTP_ISSUER
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
