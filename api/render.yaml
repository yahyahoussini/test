services:
  # --- Backend API Service ---
  - type: web
    name: api
    env: node
    plan: starter # 'free' plan may sleep, 'starter' is recommended for production
    rootDir: .
    buildFilter:
      paths:
      - api/**
      - shared/**
      - package.json
      - package-lock.json
    buildCommand: "npm install && npm run build --workspace=api"
    startCommand: "npm run start:api"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-cache
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false # Set this in the Render dashboard to your frontend's URL
      - fromGroup: api-secrets

  # --- PostgreSQL Database ---
  - type: pserv
    name: postgres-db
    env: postgres
    plan: starter # 'free' plan has limitations
    postgresMajorVersion: 15
    disk:
      name: postgres-data
      sizeGB: 1

  # --- Redis Instance ---
  - type: redis
    name: redis-cache
    plan: starter # 'free' plan has limitations
    ipAllowList: [] # Render automatically allows access from services in the same account

# --- Environment Variable Group for Secrets ---
# Create this group in your Render dashboard under "Environment"
envVarGroups:
  - name: api-secrets
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: TOTP_ISSUER
        value: TussnaAdmin
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
